name: Flyer intelligence pipeline

on:
  push:
    branches: [main]
    paths: ['tools/**', 'tests/**', '.github/workflows/catalog.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flyer-catalog-pages
  cancel-in-progress: false

jobs:
  extract-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check beautifulsoup4==4.15.0 Pillow==12.1.0 opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Install flyer text reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita
          mkdir -p work/tessdata
          curl --fail --retry 3 -L https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/ita.traineddata -o work/tessdata/ita.traineddata
          echo "TESSDATA_PREFIX=$PWD/work/tessdata" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: work/ocr-cache
          key: flyer-ocr-${{ hashFiles('tools/effe_ocr.py') }}-${{ github.run_id }}
          restore-keys: flyer-ocr-${{ hashFiles('tools/effe_ocr.py') }}-
      - name: Test date parsing, edition selection and failure isolation
        run: python -m unittest discover -s tests -p 'test_sources.py'
      - name: Discover all supermarket flyers
        run: python tools/publish_catalogs.py --output public/catalog --previous https://chatgptplusitausers-lab.github.io/offerte-infernetto-catalog/catalog
      - name: Validate catalog index
        run: python -m json.tool public/catalog/index.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-diagnostics
          path: public/catalog
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
